name: Build apps

# Builds the two deliverables: the Android APK and the Windows installer.
# - Push to main: artifacts are attached to the workflow run. The version comes
#   from the VERSION file. When no GitHub Release exists yet for that version,
#   the release job publishes one (tag vX.Y.Z on this commit). To ship a new
#   release, raise VERSION.
# - Push of a tag vX.Y.Z: the same builds are published as that GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "core/**"
      - "config/**"
      - "shared/**"
      - "installer/**"
      - "VERSION"
      - "docs/release-notes/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so builds are reproducible; raise it deliberately.
  FLUTTER_VERSION: 3.50.x

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"
          elif [ -f VERSION ]; then version="$(tr -d '[:space:]' < VERSION)"
          else version="0.0.$GITHUB_RUN_NUMBER"; fi
          echo "RISHU_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Analyze and test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Use the release signing key when the owner has added one
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > app/android/key.properties
            echo "APK signing: release key" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "APK signing: debug key (no ANDROID_KEYSTORE_BASE64 secret yet; see docs/NEEDS_USER.md)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build release APKs (one per CPU type)
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="$RISHU_VERSION" --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=RISHU_VERSION="$RISHU_VERSION"
      - name: Remove the signing files from the runner
        if: always()
        run: rm -f app/android/key.properties app/android/app/upload-keystore.jks
      - name: Check the 30 MB size budget
        working-directory: app
        run: |
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          size=$(stat -c %s "$apk")
          echo "arm64 APK size: $((size / 1024 / 1024)) MB ($size bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$size" -le $((30 * 1024 * 1024))
          mkdir -p ../dist-android
          cp "$apk" "../dist-android/Rishu-$RISHU_VERSION-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: rishu-android
          path: dist-android/*.apk
          retention-days: 14

  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"
          elif [ -f VERSION ]; then version="$(tr -d '[:space:]' < VERSION)"
          else version="0.0.$GITHUB_RUN_NUMBER"; fi
          echo "RISHU_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - name: Package the core with PyInstaller
        run: |
          python -m pip install -e "core[web,voice]" pyinstaller
          # --hide-console: no black window when the app starts the core.
          python -m PyInstaller --noconfirm --onedir --name rishu-core \
            --hide-console hide-early \
            --add-data "config:config" --add-data "shared:shared" \
            --collect-all trafilatura --collect-all justext --collect-all courlan \
            --collect-all htmldate --collect-all ddgs \
            --collect-submodules uvicorn --collect-submodules websockets \
            --collect-submodules anyio \
            --collect-all edge_tts --collect-submodules aiohttp --collect-data certifi \
            --collect-data docx --collect-submodules openpyxl \
            --collect-all sounddevice --collect-all _sounddevice_data \
            core/run_core.py
      - name: Bundle the offline model engine (llama.cpp server, MIT)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The CPU build of llama.cpp's server; the model file is downloaded
          # later by the user from Settings (it is not in the installer).
          mkdir -p llama dist/rishu-core/local-llm
          # Newest release that carries a plain CPU build for 64-bit Windows
          # (llama.cpp also publishes tags without binaries, and GPU variants).
          gh api "repos/ggml-org/llama.cpp/releases?per_page=40" \
            --jq '.[] | .tag_name as $t | .assets[] | "\($t) \(.name) \(.browser_download_url)"' > llama/assets.txt || true
          head -n 40 llama/assets.txt
          line=$(grep -iE ' [^ ]*win[^ ]*x64[^ ]*\.zip ' llama/assets.txt \
                 | grep -viE 'cuda|cudart|vulkan|hip|sycl|opencl|arm64|kompute|radeon|rocm' | head -1 || true)
          url=$(echo "$line" | awk '{print $3}')
          echo "chosen: ${line:-none}"
          if [ -n "$url" ] && curl -fsSL -o llama/server.zip "$url"; then
            unzip -q -o llama/server.zip -d llama/unzipped
            server=$(find llama/unzipped -name llama-server.exe | head -1)
            if [ -n "$server" ]; then
              cp "$(dirname "$server")"/*.dll "$server" dist/rishu-core/local-llm/
              gh api repos/ggml-org/llama.cpp/contents/LICENSE --jq .content | base64 -d > dist/rishu-core/local-llm/LICENSE-llama.cpp.txt
              ls -la dist/rishu-core/local-llm
              dist/rishu-core/local-llm/llama-server.exe --version || true
            else
              echo "::warning::the llama.cpp download has no llama-server.exe"
            fi
          else
            echo "::warning::llama.cpp server could not be downloaded; this build has no offline model engine"
          fi
      - name: Smoke-test the packaged core
        env:
          RISHU_HOME: ${{ runner.temp }}/rishu-home
        run: |
          # --selftest also starts the local server and runs a turn over WebSocket.
          dist/rishu-core/rishu-core.exe --selftest
          dist/rishu-core/rishu-core.exe --offline --once "Rishu, time kya hua hai?"
      - name: Voice check of the packaged core
        env:
          RISHU_HOME: ${{ runner.temp }}/rishu-home
        run: |
          dist/rishu-core/rishu-core.exe --voicetest | tee voicetest.txt
          { echo '### Voice check'; echo '```'; cat voicetest.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build the Windows app
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release \
            --build-name="$RISHU_VERSION" --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=RISHU_VERSION="$RISHU_VERSION"
      - name: Build the installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:RISHU_VERSION" installer\rishu.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist-installer | Format-Table Name, Length
      - name: End-to-end check of the installed app
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist-installer\RishuSetup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'RishuInstalled'
          Start-Process $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir" -Wait
          if (-not (Test-Path "$dir\rishu.exe")) { throw 'rishu.exe was not installed' }
          if (-not (Test-Path "$dir\core\rishu-core.exe")) { throw 'the core was not installed' }
          $env:RISHU_SMOKE_FILE = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          $env:RISHU_HOME = Join-Path $env:RUNNER_TEMP 'rishu-e2e-home'
          $app = Start-Process "$dir\rishu.exe" -PassThru
          if (-not $app.WaitForExit(240000)) { $app.Kill(); throw 'the app did not finish the smoke test in time' }
          $result = Get-Content $env:RISHU_SMOKE_FILE -Raw -Encoding utf8
          "### Installed app smoke test`n``````n$result`n``````" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Write-Output $result
          Start-Sleep -Seconds 5
          $left = Get-Process rishu-core -ErrorAction SilentlyContinue
          if ($left) { throw 'the core kept running after the app exited' }
          if (-not $result.StartsWith('ok')) { throw "smoke test failed: $result" }
      - uses: actions/upload-artifact@v4
        with:
          name: rishu-windows
          path: dist-installer/RishuSetup-*.exe
          retention-days: 14

  release:
    name: Publish the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    # The Windows installer is the deliverable for now; an Android build problem
    # (e.g. a Gradle repository hiccup) must not hold the Windows release back.
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Windows only for now: the Android app needs its own on-phone core
      # (Phase 7) before it is useful, so its APK is not published yet.
      - uses: actions/download-artifact@v4
        with:
          pattern: rishu-windows
          path: release-files
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la release-files
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(tr -d '[:space:]' < VERSION)"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists; raise VERSION to publish a new one." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          notes="docs/release-notes/$tag.md"
          if [ ! -f "$notes" ]; then
            notes="$RUNNER_TEMP/notes.md"
            {
              echo "Rishu $tag"
              echo
              echo "- Windows: download \`RishuSetup-${tag#v}.exe\` and run it. Windows may show an \"Unknown publisher\" warning because the installer is not code-signed yet: choose **More info → Run anyway**."
              echo "- Android: download the \`.apk\`, open it on the phone and allow installing from this source."
              echo
              echo "See docs/PROGRESS.md for what works in this build."
            } > "$notes"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-files/* --clobber
          else
            gh release create "$tag" release-files/* --title "Rishu $tag" --notes-file "$notes" --target "$GITHUB_SHA"
            echo "Published release $tag" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
