name: Build apps

# Builds the two deliverables: the Android APK and the Windows installer.
# Artifacts are attached to the workflow run; tagged releases come later.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "config/**"
      - "shared/**"
      - "installer/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  RISHU_VERSION: 0.0.${{ github.run_number }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Add platform scaffolding if it is not in the repo yet
        working-directory: app
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.rishuai --project-name rishu "$RUNNER_TEMP/gen"
            cp -r "$RUNNER_TEMP/gen/android" android
          fi
      - name: Keep the generated scaffolding (to be committed to the repo)
        if: hashFiles('app/android/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: scaffold-android
          path: app/android
          include-hidden-files: true
          retention-days: 7
      - name: Analyze and test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build release APKs (one per CPU type)
        working-directory: app
        run: flutter build apk --release --split-per-abi --dart-define=RISHU_VERSION=$RISHU_VERSION
      - name: Check the 30 MB size budget
        working-directory: app
        run: |
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          size=$(stat -c %s "$apk")
          echo "arm64 APK size: $((size / 1024 / 1024)) MB ($size bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$size" -le $((30 * 1024 * 1024))
      - uses: actions/upload-artifact@v4
        with:
          name: rishu-android-${{ env.RISHU_VERSION }}
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14

  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - name: Package the core with PyInstaller
        run: |
          python -m pip install -e "core[web]" pyinstaller
          python -m PyInstaller --noconfirm --onedir --name rishu-core \
            --add-data "config:config" --add-data "shared:shared" \
            --collect-all trafilatura --collect-all justext --collect-all courlan \
            --collect-all htmldate --collect-all ddgs \
            core/run_core.py
      - name: Smoke-test the packaged core
        env:
          RISHU_HOME: ${{ runner.temp }}/rishu-home
        run: |
          dist/rishu-core/rishu-core.exe --selftest
          dist/rishu-core/rishu-core.exe --offline --once "Rishu, time kya hua hai?"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Add platform scaffolding if it is not in the repo yet
        working-directory: app
        run: |
          if [ ! -d windows ]; then
            flutter create --platforms=windows --org com.rishuai --project-name rishu "$RUNNER_TEMP/gen"
            cp -r "$RUNNER_TEMP/gen/windows" windows
          fi
      - name: Keep the generated scaffolding (to be committed to the repo)
        if: hashFiles('app/windows/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: scaffold-windows
          path: app/windows
          include-hidden-files: true
          retention-days: 7
      - name: Build the Windows app
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release --dart-define=RISHU_VERSION=$RISHU_VERSION
      - name: Build the installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:RISHU_VERSION" installer\rishu.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist-installer | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: rishu-windows-${{ env.RISHU_VERSION }}
          path: dist-installer/RishuSetup-*.exe
          retention-days: 14
