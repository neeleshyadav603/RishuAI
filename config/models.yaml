# LLM providers and models. Model IDs live ONLY here, never in code.
# The router also asks each provider's /models endpoint which IDs exist and
# skips configured IDs that are gone. Edit freely; free tiers change often.
#
# Roles: fast (intent, chit-chat), smart (planning, tutoring, research),
#        coder (Self-Update Lab), vision (screenshots).
# label and key_url are shown in the app's setup screen (where to get a free key).

order: [groq, gemini, openrouter, rishu_local, ollama]

providers:
  groq:
    label: Groq
    key_url: https://console.groq.com/keys
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    models:
      fast: [llama-3.1-8b-instant, openai/gpt-oss-20b]
      smart: [llama-3.3-70b-versatile, openai/gpt-oss-120b, meta-llama/llama-4-scout-17b-16e-instruct, llama-3.1-8b-instant]
      coder: [openai/gpt-oss-120b, llama-3.3-70b-versatile]
      vision: [meta-llama/llama-4-scout-17b-16e-instruct, meta-llama/llama-4-maverick-17b-128e-instruct]

  gemini:
    label: Google Gemini
    key_url: https://aistudio.google.com/apikey
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    models:
      fast: [gemini-2.5-flash-lite]
      smart: [gemini-2.5-flash]
      coder: [gemini-2.5-flash]
      vision: [gemini-2.5-flash]

  openrouter:
    label: OpenRouter
    key_url: https://openrouter.ai/keys
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    models:
      fast: []
      smart: []
      coder: []
      vision: []

  # Rishu's own offline model (llama.cpp server shipped with Rishu, model file
  # downloaded once from Settings). No key, no daily limit; slower, simpler.
  rishu_local:
    label: Rishu offline model
    key_url: ""
    base_url: http://127.0.0.1:1/v1  # replaced by the started server's address
    local: true
    managed: true
    compact_prompt: true  # shared/prompts/system_rules_compact.md instead of the long rules
    # Only these tools are offered to the small model (short prompt = fast on a CPU).
    tools_allow: [get_time, open_app, open_url, play_youtube, browser_search, set_reminder, list_reminders,
                  cancel_reminder, weather, add_note, list_notes, remember, list_memories, volume, battery_status,
                  screenshot, lock_computer, whatsapp_send, whatsapp_draft, email_draft, list_skills,
                  timetable_show, open_file, find_files, morning_briefing, deadlines]
    models:
      fast: []
      smart: []
      coder: []
      vision: []

  # Local models through Ollama (desktop only). No key. When the lists are
  # empty the router uses whatever models Ollama reports as installed.
  ollama:
    label: Ollama (local)
    key_url: https://ollama.com/download
    base_url: http://127.0.0.1:11434/v1
    local: true
    models:
      fast: []
      smart: []
      coder: []
      vision: []

# Speech to text (voice input). Uses the API key of stt_provider.
speech:
  stt_provider: groq
  stt_models: [whisper-large-v3-turbo, whisper-large-v3]

# Rishu's offline model files (Apache-2.0 Qwen3, GGUF from the ggml-org
# repositories on Hugging Face; the exact file is looked up when downloading).
local_model:
  default: small
  ctx_size: 6144
  choices:
    small:
      label: "Chhota: Qwen3 0.6B (about 0.5-0.7 GB, 4 GB RAM laptops)"
      repo: ggml-org/Qwen3-0.6B-GGUF
      # Preferred quantisation; if the repo does not publish it, the next of
      # Q4_K_S, Q4_0, Q5_K_M, Q5_0, Q6_K, Q8_0 that it has is used.
      file_suffix: Q4_K_M.gguf
      size_mb: 480
    better:
      label: "Behtar: Qwen3 1.7B (about 1.3 GB, 8 GB RAM)"
      repo: ggml-org/Qwen3-1.7B-GGUF
      file_suffix: Q4_K_M.gguf
      size_mb: 1280
