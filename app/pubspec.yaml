name: rishu
description: Rishu, a voice-first personal AI assistant for Windows and Android.
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
  assets:
    # The phone's own brain: providers, model IDs and prompts (generated from config/).
    - assets/brain.json
