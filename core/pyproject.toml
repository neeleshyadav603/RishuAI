[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rishu-core"
version = "0.1.0"
description = "Rishu desktop core: agent loop, LLM router, tools, permissions"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    # Local API for the app (spec §4): MIT / BSD-3-Clause / BSD-3-Clause.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13.0",
]

[project.optional-dependencies]
web = ["ddgs>=9.0", "trafilatura>=1.12"]
# Voice: edge-tts (natural online voices) and sounddevice (microphone, MIT).
voice = ["edge-tts>=7.0", "sounddevice>=0.5"]
dev = ["pytest>=8.0", "ruff>=0.6", "jsonschema>=4.20"]

[project.scripts]
rishu = "rishu_core.cli:main"

[tool.setuptools.packages.find]
include = ["rishu_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long user-facing strings are fine; the formatter wraps everything else.
ignore = ["E501"]
