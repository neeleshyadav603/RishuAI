[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rishu-core"
version = "0.1.0"
description = "Rishu desktop core: agent loop, LLM router, tools, permissions"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "PyYAML>=6.0"]

[project.optional-dependencies]
web = ["ddgs>=9.0", "trafilatura>=1.12"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
rishu = "rishu_core.cli:main"

[tool.setuptools.packages.find]
include = ["rishu_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
